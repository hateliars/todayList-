{% block content %}

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background-color: #f5f6f8;
        font-family: Arial, sans-serif;
    }

    .signup-container {
        width: 420px;
        margin: 60px auto;
        padding: 40px;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
    }

    .signup-container h1 {
        margin: 0 0 30px;
        text-align: center;
        font-size: 28px;
    }

    .input-group {
        margin-bottom: 16px;
    }

    .input-group label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: bold;
    }

    .input-group input,
    .input-group textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    .input-group input {
        height: 43px;
    }

    .input-group textarea {
        height: 90px;
        resize: none;
    }

    .input-group input:focus,
    .input-group textarea:focus {
        outline: none;
        border-color: #333;
    }

    .button-area {
        display: flex;
        gap: 10px;
        margin-top: 25px;
    }

    .button-area button,
    .button-area a {
        flex: 1;
        height: 45px;
        border-radius: 5px;
        font-size: 14px;
        text-align: center;
        line-height: 45px;
        text-decoration: none;
        cursor: pointer;
    }

    .signup-button {
        border: none;
        background-color: #333;
        color: white;
    }

    .signup-button:hover {
        background-color: #222;
    }

    .cancel-button {
        border: 1px solid #ccc;
        background-color: white;
        color: #333;
    }

    .cancel-button:hover {
        background-color: #f5f5f5;
    }

    .error {
        margin-bottom: 20px;
        padding: 10px;
        background-color: #fff1f1;
        border: 1px solid #ffcccc;
        border-radius: 5px;
        color: #d00;
        font-size: 13px;
    }
</style>

<div class="signup-container">

    <h1>회원가입</h1>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post" action="/member/insert/save">

        {% csrf_token %}

        <div class="input-group">
            <label for="username">아이디</label>
            <input type="text"
                   id="username"
                   name="username"
                   placeholder="아이디를 입력하세요"
                   required>
        </div>

        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="비밀번호를 입력하세요"
                   required>
        </div>

        <div class="input-group">
            <label for="password_confirm">비밀번호 확인</label>
            <input type="password"
                   id="password_confirm"
                   name="password_confirm"
                   placeholder="비밀번호를 다시 입력하세요"
                   required>
        </div>

        <div class="input-group">
            <label for="email">이메일</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="example@email.com"
                   required>
        </div>

        <div class="input-group">
            <label for="birth_date">생년월일</label>
            <input type="date"
                   id="birth_date"
                   name="birth_date">
        </div>

        <div class="input-group">
            <label for="height">키 (cm)</label>
            <input type="number"
                   id="height"
                   name="height"
                   step="0.01"
                   placeholder="예: 175.5">
        </div>

        <div class="input-group">
            <label for="bio">자기소개</label>
            <textarea id="bio"
                      name="bio"
                      placeholder="간단한 자기소개를 입력하세요"></textarea>
        </div>

        <div class="button-area">
            <a href="/member/" class="cancel-button">취소</a>

            <button type="submit" class="signup-button">
                회원가입
            </button>
        </div>

    </form>

</div>

{% endblock %}
