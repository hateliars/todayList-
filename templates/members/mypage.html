{% block content %}
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background-color: #f5f6f8;
        font-family: Arial, sans-serif;
    }

    .mypage-container {
        width: 700px;
        margin: 60px auto;
        padding: 35px;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
    }

    .top-area {
        margin-bottom: 25px;
    }

    .back-button {
        color: #333;
        text-decoration: none;
        font-size: 14px;
    }

    .back-button:hover {
        text-decoration: underline;
    }

    .section {
        border-top: 1px solid #eee;
        padding-top: 25px;
    }

    .form-row {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
    }

    .form-row label {
        width: 100px;
        font-size: 14px;
        font-weight: bold;
    }

    .form-row input,
    .form-row textarea {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    .form-row textarea {
        height: 100px;
        resize: vertical;
    }

    .form-row input:focus,
    .form-row textarea:focus {
        outline: none;
        border-color: #333;
    }

    .update-button {
        width: 100%;
        height: 42px;
        margin-top: 10px;
        border: none;
        border-radius: 5px;
        background-color: #333;
        color: white;
        cursor: pointer;
    }

    .delete-section {
        margin-top: 40px;
        padding-top: 25px;
        border-top: 1px solid #eee;
    }

    .delete-section h1 {
        margin: 0 0 15px 0;
        font-size: 20px;
    }

    .delete-button {
        width: 100%;
        height: 42px;
        border: none;
        border-radius: 5px;
        background-color: #d00;
        color: white;
        cursor: pointer;
    }
</style>

<div class="mypage-container">
    <div class="top-area">
        <a href="/todo/" class="back-button">← 돌아가기</a>
    </div>

    <div class="section">

        <form method="post" action="/member/mypage/update/">

            {% csrf_token %}

            <div class="form-row">
                <label>아이디</label>
                <input type="text"
                    name="username"
                    value="{{ member.1 }}"
                    readonly>
            </div>

            <div class="form-row">
                <label>비밀번호</label>
                <input type="password"
                    name="password"
                    placeholder="변경할 비밀번호">
            </div>

            <div class="form-row">
                <label>이메일</label>
                <input type="email"
                    name="email"
                    value="{{ member.3 }}"
                    required>
            </div>

            <div class="form-row">
                <label>생년월일</label>
                <input type="datetime-local"
                    name="birth_date"
                    value="{{ member.4|date:'Y-m-d\\TH:i' }}">
            </div>

            <div class="form-row">
                <label>나이</label>
                <input type="number"
                    name="age"
                    value="{{ member.5 }}">
            </div>

            <div class="form-row">
                <label>키</label>
                <input type="number"
                    step="0.01"
                    name="height"
                    value="{{ member.7 }}">
            </div>

            <div class="form-row">
                <label>자기소개</label>
                <textarea name="bio">{{ member.8 }}</textarea>
            </div>

            <button type="submit" class="update-button">
                회원정보 수정
            </button>

        </form>

    </div>

    <div class="delete-section">

        <h1>회원탈퇴</h1>

        <form method="post"
            action="/member/mypage/delete/"
            onsubmit="return deleteMember();">

            {% csrf_token %}

            <button type="submit" class="delete-button">
                회원탈퇴
            </button>

        </form>

    </div>
</div>

<script>
    function deleteMember() {

        return confirm(
            "회원탈퇴를 하면 계정을 복구할 수 없습니다.\n정말 탈퇴하시겠습니까?"
        );

    }
</script>

{% endblock %}
