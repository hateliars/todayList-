{% block content %}

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background-color: #f5f6f8;
        font-family: Arial, sans-serif;
    }

    .todo-container {
        width: 700px;
        margin: 60px auto;
        padding: 35px;
        background-color: white;
        border: 1px solid #ddd;
        border-radius: 8px;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .header h1 {
        margin: 0;
        font-size: 26px;
    }

    .user-info {
        font-size: 14px;
        color: #666;
    }

    .mypage-button {
        margin-left: 10px;
        color: #333;
        text-decoration: none;
        font-weight: bold;
    }    

    .logout-button {
        margin-left: 10px;
        color: #333;
        text-decoration: none;
        font-weight: bold;
    }

    .logout-button:hover {
        text-decoration: underline;
    }

    .todo-form {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        margin-bottom: 25px;
    }

    /* 할 일 입력 */
    .todo-form > input[type="text"] {
        flex: 1;
        min-width: 0;
        height: 43px;
        padding: 0 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
    }

    .todo-form > input[type="text"]:focus {
        outline: none;
        border-color: #333;
    }

    /* 날짜 영역 */
    .date-field {
        display: flex;
        flex-direction: column;
        width: 160px;
        gap: 5px;
    }

    .date-field label {
        height: 16px;
        font-size: 12px;
        color: #333;
        text-align: left;
    }

    .date-field input {
        width: 100%;
        height: 43px;
        padding: 0 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 12px;
    }

    /* 추가 버튼 */
    .add-button {
        width: 70px;
        height: 43px;
        flex-shrink: 0;
        border: none;
        border-radius: 5px;
        background-color: #333;
        color: white;
        cursor: pointer;
    }

    .add-button:hover {
        background-color: #222;
    }


    .todo-list {
        border-top: 1px solid #eee;
    }

    .todo-item {
        display: flex;
        align-items: center;
        min-height: 55px;
        padding: 10px 5px;
        border-bottom: 1px solid #eee;
    }

    .todo-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin-right: 12px;
    }

    .todo-name {
        flex: 1;
        font-size: 15px;
    }

    .todo-item.completed .todo-name {
        color: #999;
        text-decoration: line-through;
    }

    .todo-date {
        margin-right: 15px;
        color: #999;
        font-size: 12px;
    }

    .update-button {
        border: none;
        background-color: transparent;
        color: #222;
        cursor: pointer;
        font-size: 13px;
    }

    .delete-button {
        border: none;
        background-color: transparent;
        color: #d00;
        cursor: pointer;
        font-size: 13px;
    }

    .delete-button:hover {
        text-decoration: underline;
    }

    .empty-message {
        padding: 40px 0;
        text-align: center;
        color: #999;
        font-size: 14px;
    }

    .todo-name.urgent {
        color: red;
    }    
</style>

<div class="todo-container">

    <div class="header">
        <h1>TodoList</h1>

        <div class="user-info">
            {{ username }}님
            <a href = "/member/mypage/" class = "mypage-button">마이페이지</a>
            <a href="/member/logout/" class="logout-button">로그아웃</a>
        </div>
    </div>

    <form method="post" action="/todo/insert/" class="todo-form">

        {% csrf_token %}

        <input type="text"
               name="todoName"
               placeholder="할 일을 입력하세요"
               required>

        <div class="date-field">
            <label>시작날짜</label>
            <input type="datetime-local"
                name="startDate">
        </div>

        <div class="date-field">
            <label>종료날짜</label>
            <input type="datetime-local"
                name="endDate">
        </div>

        <button type="submit" class="add-button">
            추가
        </button>

    </form>

    <div class="todo-list">

        {% if todos %}

            {% for todo in todos %}

                <div class="todo-item {% if todo.5 %}completed{% endif %}">

                    <input type="checkbox"
                        {% if todo.5 %}checked{% endif %}
                        onclick="completeTodo({{ todo.0 }}, this.checked)">

                    <span class="todo-name {% if todo.6 %}urgent{% endif %}" id="todo-name-{{ todo.0 }}">
                        {{ todo.1 }}
                    </span>

                    {% if todo.3 %}
                        <span class="todo-date">
                            {{ todo.3 }}
                        </span>
                    {% endif %}

                    <button type="button"
                            class="update-button"
                            onclick="updateTodo({{ todo.0 }}, '{{ todo.1 }}')">
                        수정
                    </button>

                    <button type="button"
                            class="delete-button"
                            onclick="deleteTodo({{ todo.0 }})">
                        삭제
                    </button>

                </div>

            {% endfor %}

        {% else %}

            <div class="empty-message">
                등록된 할 일이 없습니다.
            </div>

        {% endif %}

    </div>

</div>

<script>
    function updateTodo(todoId, todoName) {

        var todoNameArea = document.getElementById("todo-name-" + todoId);

        todoNameArea.innerHTML =
            '<input type="text" id="update-input-' + todoId + '" value="' + todoName + '">' +
            '<button type="button" onclick="saveTodo(' + todoId + ')">저장</button>';

    }

    function saveTodo(todoId) {

        var todoNameContent = document.getElementById("update-input-" + todoId).value;

        if (todoNameContent == "") {
            alert("할 일을 입력해주세요.");
            return;
        }

        var form = document.createElement("form");

        form.method = "post";
        form.action = "/todo/update/";

        var csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;

        form.innerHTML =
            '<input type="hidden" name="csrfmiddlewaretoken" value="' + csrf + '">' +
            '<input type="hidden" name="todoId" value="' + todoId + '">' +
            '<input type="hidden" name="todoName" value="' + todoNameContent + '">';

        document.body.appendChild(form);

        form.submit();
    }


    function deleteTodo(todoId) {

        if (confirm("이 할 일을 삭제하시겠습니까?")) {

            var form = document.createElement("form");

            form.method = "post";
            form.action = "/todo/delete/";

            var csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;

            form.innerHTML =
                '<input type="hidden" name="csrfmiddlewaretoken" value="' + csrf + '">' +
                '<input type="hidden" name="todoId" value="' + todoId + '">';

            document.body.appendChild(form);

            form.submit();
        }

    }


    function completeTodo(todoId, checked) {

        var form = document.createElement("form");

        form.method = "post";
        form.action = "/todo/complete/";

        var csrf = document.querySelector('[name=csrfmiddlewaretoken]').value;

        var completed = checked ? 1 : 0;

        form.innerHTML =
            '<input type="hidden" name="csrfmiddlewaretoken" value="' + csrf + '">' +
            '<input type="hidden" name="todoId" value="' + todoId + '">' +
            '<input type="hidden" name="completed" value="' + completed + '">';

        document.body.appendChild(form);

        form.submit();
    }
</script>

{% endblock %}
